<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 挂在子路径 /guwen 下：显式锚定相对路径基，根治无尾斜杠访问时 api/* 解析到站点根的问题 -->
    <base href="/guwen/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f7f3ea">
<title>诗文通关 · 云端学习版</title>
<style>
/* ================= 基础 ================= */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
:root{
  --paper:#f7f3ea; --card:#fffdf6; --ink:#2a2622; --ink2:#57503f;
  --muted:#8a8272; --line:#d8d0bd;
  --red:#b03a2e; --red-d:#8f2d23; --teal:#3d5a66; --gold:#b8860b;
  --green:#3e8e5f; --green-bg:#edf4ec; --red-bg:#faeceb;
}
body{
  background:#e8e0cd;
  font-family:Georgia,'Noto Serif SC','Songti SC','STSong',serif;
  color:var(--ink); font-size:16px; line-height:1.6;
}
body.locked{overflow:hidden}
#app{
  max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);
  box-shadow:0 0 42px rgba(42,38,34,.22);position:relative;
}
body.prelogin #app{display:none}
#app::before{ /* 宣纸纹理 */
  content:'';position:fixed;inset:0;pointer-events:none;z-index:5;
  background-image:radial-gradient(rgba(42,38,34,.026) 1px,transparent 1.4px);
  background-size:22px 22px;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
b,strong{font-weight:700}
.view{display:none;min-height:100vh}
.view.active{display:block;animation:viewIn .26s ease both}
body:not(.no-tab) .view{padding-bottom:86px}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}38%{transform:translateY(-4.5px)}70%{transform:translateY(1px)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(62,142,95,0)}50%{box-shadow:0 0 0 7px rgba(62,142,95,.22)}}
@keyframes stampIn{
  0%{transform:scale(2.6) rotate(-14deg);opacity:0}
  55%{transform:scale(.9) rotate(2deg);opacity:1}
  76%{transform:scale(1.07) rotate(-1.5deg)}
  100%{transform:scale(1) rotate(-3deg);opacity:1}
}
@keyframes inkSpread{from{box-shadow:0 0 0 0 rgba(176,58,46,.38)}to{box-shadow:0 0 0 30px rgba(176,58,46,0)}}
@keyframes sheetIn{
  from{transform:translateX(-50%) rotateX(52deg) translateY(46px);opacity:.2}
  to{transform:translateX(-50%) rotateX(0) translateY(0);opacity:1}
}
@keyframes slideUp{from{transform:translate(-50%,64px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes ripple{to{transform:scale(2.8);opacity:0}}
@keyframes rollIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ================= 通用组件 ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(90,80,60,.08)}
.btn-main{
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:48px;padding:15px 18px;border-radius:12px;font-size:19px;letter-spacing:6px;text-indent:6px;
  color:#fdf8ee;font-weight:700;background:linear-gradient(160deg,#c14a3c,var(--red) 55%,var(--red-d));
  box-shadow:0 6px 16px rgba(176,58,46,.32),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .12s,filter .15s;
}
.btn-main:active{transform:scale(.97)}
.btn-main:disabled{opacity:.6;pointer-events:none}
.btn-main em{font-style:normal;font-size:12.5px;letter-spacing:1px;text-indent:0;opacity:.85;font-weight:400}
.btn-ghost{
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;padding:12px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:15px;letter-spacing:2px;
}
.btn-ghost:active{background:#f1ead9}
.sec{padding:0 16px;margin-top:15px}
.sec-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.sec-head i{width:4px;height:15px;background:var(--red);border-radius:2px;align-self:center}
.sec-head h2{font-size:16.5px;letter-spacing:3px;color:var(--ink)}
.sec-tip{margin-left:auto;font-size:11px;color:var(--muted)}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.sec .chip-row{padding:0 0 6px}
.chip-row.pad-x{padding-left:16px;padding-right:16px}
.chip{
  position:relative;overflow:hidden;flex:0 0 auto;display:inline-flex;align-items:center;
  min-height:44px;padding:6px 15px;border-radius:999px;font-size:13.5px;
  letter-spacing:1px;color:var(--ink2);background:var(--card);border:1px solid var(--line);
  transition:all .18s;
}
.chip.on{background:var(--red);border-color:var(--red);color:#fdf8ee;box-shadow:0 3px 8px rgba(176,58,46,.28)}
.chip:active{transform:scale(.95)}
.ripple{position:absolute;border-radius:50%;background:rgba(176,58,46,.14);pointer-events:none;transform:scale(0);animation:ripple .55s ease-out forwards}
.chip.on .ripple,.btn-main .ripple{background:rgba(255,255,255,.3)}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:14px;letter-spacing:1px}
.empty b{display:block;font-size:30px;color:var(--line);margin-bottom:8px;font-weight:400}

/* ================= 登录页（水墨） ================= */
#login-view{
  position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#f2ecdb 0%,#e8e0cd 100%);padding:20px;
}
#login-view::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(42,38,34,.04) 1px,transparent 1.4px);
  background-size:22px 22px;
}
#login-view.show{display:flex}
.login-box{
  position:relative;display:flex;width:min(94vw,720px);min-height:400px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 24px 70px rgba(42,38,34,.28);animation:fadeUp .4s ease both;
}
.login-art{
  flex:0 0 220px;position:relative;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(168deg,#44606c 0%,#2a2622 82%);overflow:hidden;
}
.login-art .art-moon{
  position:absolute;right:26px;top:30px;width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#f3e9c8,#d9c07a);opacity:.85;
  box-shadow:0 0 34px rgba(217,192,122,.45);
}
.login-art .art-mtn{
  position:absolute;left:0;right:0;bottom:0;height:46%;width:100%;
  background:
    radial-gradient(120% 90% at 18% 100%,rgba(0,0,0,.34) 38%,transparent 39%),
    radial-gradient(110% 100% at 62% 100%,rgba(0,0,0,.22) 42%,transparent 43%),
    radial-gradient(130% 110% at 96% 100%,rgba(0,0,0,.4) 40%,transparent 41%);
}
.login-title{
  position:relative;z-index:2;writing-mode:vertical-rl;font-size:52px;letter-spacing:22px;
  color:#f6f0e1;font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.35);
}
.art-seal{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%) rotate(-6deg);z-index:2;
  width:34px;height:34px;border-radius:6px;background:var(--red);color:#fdf6ea;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;
  box-shadow:0 3px 9px rgba(0,0,0,.3),inset 0 0 0 2px rgba(253,246,234,.4);
}
.login-form{flex:1;padding:44px 38px 32px;display:flex;flex-direction:column;justify-content:center}
.login-form h2{font-size:21px;letter-spacing:6px;color:var(--ink)}
.lg-sub{font-size:12.5px;color:var(--muted);letter-spacing:2px;margin:7px 0 26px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:6px}
.login-field input{
  width:100%;min-height:46px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;
  background:#fffef9;font-size:16px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;
}
.login-field input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(176,58,46,.12)}
#btn-login{margin-top:10px}
#login-msg{min-height:20px;font-size:12.5px;color:var(--red);margin-top:10px;letter-spacing:1px}
.lg-foot{font-size:11px;color:#b3aa94;letter-spacing:2px;margin-top:14px;text-align:center}

/* ================= 右上角设置 ================= */
#btn-settings{
  position:fixed;top:12px;right:12px;z-index:56;width:44px;height:44px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(42,38,34,.12);transition:background .15s;
}
#btn-settings svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
body.prelogin #btn-settings,body.no-tab #btn-settings{display:none}
@media (min-width:481px){ #btn-settings{right:calc(50% - 224px)} }

/* ================= 首页 Hero ================= */
.hero{position:relative;padding:22px 20px 2px;overflow:hidden;background:linear-gradient(180deg,#f2ecdb,var(--paper))}
.hero-mtn{display:block;width:100%;height:128px;margin-top:2px}
.hero-title{font-size:33px;letter-spacing:10px;color:var(--ink);font-weight:700;position:relative;z-index:2}
.hero-sub{font-size:13px;color:var(--ink2);letter-spacing:3px;margin-top:6px;position:relative;z-index:2}
.hero-user{font-size:12px;color:var(--teal);letter-spacing:2px;margin-top:6px;position:relative;z-index:2}
.hero-user .sync-badge{color:var(--green);margin-left:8px}
.hero-count{font-size:11.5px;color:var(--muted);letter-spacing:1px;margin-top:8px;position:relative;z-index:2}
.hero-seal{
  position:absolute;right:24px;top:64px;z-index:2;width:38px;height:38px;border-radius:7px;
  background:var(--red);color:#fdf6ea;display:flex;align-items:center;justify-content:center;
  font-size:23px;font-weight:700;transform:rotate(-5deg);
  box-shadow:0 4px 10px rgba(176,58,46,.35),inset 0 0 0 2px rgba(253,246,234,.4);
}
.mode-scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.mode-scroll::-webkit-scrollbar{display:none}
.mode-card{
  position:relative;overflow:hidden;flex:0 0 auto;width:126px;padding:14px 12px 12px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 2px 8px rgba(90,80,60,.08);transition:all .18s;
}
.mode-card .mode-ico{
  display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:7px;
  background:rgba(61,90,102,.1);color:var(--teal);font-size:17px;font-weight:700;margin-bottom:9px;
  box-shadow:inset 0 0 0 1px rgba(61,90,102,.25);
}
.mode-card .mode-name{display:block;font-size:15.5px;letter-spacing:1px;font-weight:700}
.mode-card .mode-desc{display:block;font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.5px}
.mode-card.on{border-color:var(--red);box-shadow:0 4px 14px rgba(176,58,46,.22)}
.mode-card.on .mode-ico{background:var(--red);color:#fdf6ea;box-shadow:inset 0 0 0 1px rgba(253,246,234,.4)}
.mode-card.on::after{
  content:'';position:absolute;right:-9px;top:-9px;width:26px;height:26px;background:var(--red);
  transform:rotate(45deg);
}
.mode-card.on::before{
  content:'✓';position:absolute;right:1px;top:0;z-index:2;color:#fdf6ea;font-size:11px;
}
.start-sec{margin-top:15px;padding-bottom:30px}
.goal-card{display:flex;align-items:center;gap:14px;padding:13px 16px;margin-bottom:14px}
.ring{width:66px;height:66px;flex:0 0 auto}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .ring-bg{stroke:#eae2cd}
.ring .ring-fg{stroke:var(--red);stroke-dasharray:188.5;transition:stroke-dashoffset .6s cubic-bezier(.3,.8,.3,1);transform:rotate(-90deg);transform-origin:36px 36px}
.ring text{font-size:12.5px;fill:var(--ink);text-anchor:middle;font-family:inherit}
.goal-txt b{display:block;font-size:15px;letter-spacing:1px}
.goal-txt span{font-size:12px;color:var(--muted)}
.goal-txt em{font-style:normal;color:var(--gold)}

/* ================= 答题页 ================= */
#view-quiz{position:relative}
.quiz-cols{display:block}
.quiz-top{position:sticky;top:0;z-index:12;background:linear-gradient(180deg,var(--paper) 82%,rgba(247,243,234,0));padding:12px 16px 4px}
.quiz-row{display:flex;align-items:center;gap:10px}
.quiz-quit{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:19px;color:var(--ink2);line-height:1}
.quiz-meta{flex:1;text-align:center;font-size:13px;color:var(--teal);letter-spacing:2px}
.quiz-meta b{color:var(--red);margin-left:8px;font-weight:400}
.quiz-num{font-size:13px;color:var(--muted);min-width:42px;text-align:right;letter-spacing:1px}
.pbar{height:4px;background:#e3d7ba;border-radius:2px;margin-top:9px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),#d15a48);border-radius:2px;transition:width .35s ease}
.quiz-body{padding:16px 16px 120px}
.qtag{
  display:inline-block;font-size:11.5px;letter-spacing:3px;color:var(--gold);
  border:1px solid rgba(184,134,11,.4);padding:2px 10px 2px 12px;border-radius:4px;margin-bottom:10px;
}
.q-stem{
  font-size:21.5px;line-height:1.75;letter-spacing:.5px;padding:18px 16px 16px;margin-bottom:18px;
  border-left:3px solid var(--red);border-radius:4px 10px 10px 4px;
}
.q-stem.q-anim{animation:fadeUp .35s ease both}
#opt-list{display:flex;flex-direction:column;gap:11px}
.opt{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:48px;
  padding:13px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  box-shadow:0 2px 6px rgba(90,80,60,.06);font-size:17px;line-height:1.5;letter-spacing:.5px;
  transition:border-color .2s,background .2s,transform .1s;
}
.opt:active{transform:scale(.985)}
.opt-key{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:50%;background:rgba(61,90,102,.1);color:var(--teal);font-size:14.5px;
  box-shadow:inset 0 0 0 1px rgba(61,90,102,.3);
}
.opt.done{pointer-events:none}
.opt.correct{border-color:var(--green);background:var(--green-bg)}
.opt.correct .opt-key{background:var(--green);color:#f2f8f0;box-shadow:none}
.opt.correct.breathe{animation:breathe 1.4s ease-in-out .2s 2}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.wrong .opt-key{background:var(--red);color:#fdf3ee;box-shadow:none}
.opt.wrong.shake{animation:shakeX .45s ease}
.opt.picked{border-width:2px}

/* ---- 宽屏答题侧板（≥1024 显示） ---- */
.quiz-side{display:none}
.side-card{padding:16px 16px 14px;margin-bottom:12px}
.side-h{font-size:13.5px;letter-spacing:3px;color:var(--ink2);margin-bottom:10px}
.side-goal{display:flex;align-items:center;gap:14px}
.side-big{font-size:34px;line-height:1;color:var(--red);font-weight:700}
.side-big i{font-style:normal;font-size:16px;color:var(--muted);font-weight:400}
.side-goal .goal-txt span{display:block;margin-top:4px}
.side-row3{display:flex;text-align:center;padding:12px 8px;margin-bottom:12px}
.side-row3>div{flex:1}
.side-row3 b{display:block;font-size:20px;color:var(--ink);line-height:1.25}
.side-row3 span{font-size:11px;color:var(--muted);letter-spacing:1px}
.side-sync{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;margin-bottom:12px;font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.side-sync .sync-badge{color:var(--green)}
.side-hint{
  text-align:center;font-size:12px;color:var(--muted);letter-spacing:2px;padding:14px 10px;
  border:1px dashed var(--line);border-radius:10px;background:rgba(255,253,246,.6);
}
.side-verdict{font-size:16px;letter-spacing:3px;font-weight:700;padding:12px 16px;margin-bottom:10px}
.side-verdict.v-ok{color:var(--green)}
.side-verdict.v-no{color:var(--red)}
.quiz-side .v-ans{font-size:13px;margin-bottom:10px;padding:0 2px}
.side-kcard{padding:14px 16px;margin-bottom:14px}
.side-next{min-height:48px}

/* 落章 */
.stamp{
  position:absolute;left:50%;top:31%;z-index:30;width:88px;height:88px;margin-left:-44px;
  display:flex;align-items:center;justify-content:center;border-radius:15px;color:#fdf3e6;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.14),transparent 46%),var(--red);
  box-shadow:0 8px 20px rgba(176,58,46,.4),inset 0 0 0 2px rgba(253,243,230,.35),inset 0 0 0 7px rgba(176,58,46,.9),inset 0 0 0 8.5px rgba(253,243,230,.5);
  animation:stampIn .55s cubic-bezier(.18,1.2,.4,1) both;
}
.stamp::after{content:'';position:absolute;inset:-8px;border-radius:18px;animation:inkSpread .8s ease-out both}
.stamp span{font-size:40px;font-weight:700;letter-spacing:2px;text-shadow:0 1px 3px rgba(0,0,0,.18)}
.stamp.combo span{font-size:19px;letter-spacing:3px;text-indent:3px;white-space:nowrap}
.stamp.stamp-out{transition:opacity .32s,transform .32s;opacity:0;transform:rotate(-3deg) scale(.88)}
/* 连中三元金印 */
#combo-badge{
  position:absolute;top:62px;right:14px;z-index:28;display:none;
  writing-mode:vertical-rl;font-size:13px;letter-spacing:4px;color:#fdf6e4;
  background:linear-gradient(150deg,#cfa94e,var(--gold));padding:10px 7px;border-radius:8px;
  box-shadow:0 5px 14px rgba(184,134,11,.42),inset 0 0 0 1.5px rgba(253,246,228,.45);
  transform:rotate(7deg);animation:pop .3s both,flash 1.1s .35s infinite;
}
#combo-badge.show{display:block}

/* ================= 解析卡（底部知识卡，移动端） ================= */
#sheet-wrap{position:fixed;inset:0;z-index:60;display:none;pointer-events:none;perspective:1100px}
#sheet-wrap.open{display:block;pointer-events:auto}
.sheet-mask{position:absolute;inset:0;background:rgba(42,38,34,.38);animation:fadeIn .3s both}
.sheet{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -10px 34px rgba(42,38,34,.28);
  max-height:54vh;display:flex;flex-direction:column;transform-origin:50% 100%;
  transition:max-height .32s cubic-bezier(.3,.8,.3,1);
}
#sheet-wrap.open .sheet{animation:sheetIn .5s cubic-bezier(.2,.9,.35,1.03) both}
.sheet.expanded{max-height:93vh}
.sheet-grab{padding:9px 0 3px;text-align:center;flex:0 0 auto}
.sheet-grab i{display:block;width:40px;height:4.5px;border-radius:3px;background:#d9d0ba;margin:0 auto}
.sheet-grab .grab-tip{display:block;font-size:10.5px;color:var(--muted);letter-spacing:2px;margin-top:4px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 12px}
.sheet-foot{flex:0 0 auto;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px dashed var(--line)}
.verdict{font-size:15.5px;letter-spacing:3px;font-weight:700;margin-bottom:4px;animation:rollIn .4s .15s both}
.verdict.v-ok{color:var(--green)}
.verdict.v-no{color:var(--red)}
.v-ans{font-size:13.5px;margin-bottom:6px;animation:rollIn .4s .25s both}
.v-mine{color:var(--red);margin-right:14px}
.v-right{color:var(--green)}

/* ================= 知识卡 ================= */
.k-head .k-title{font-size:25px;font-weight:700;letter-spacing:2px;line-height:1.4}
.k-head .k-meta{font-size:13.5px;color:var(--teal);margin-top:5px;letter-spacing:1px}
.k-head .k-meta i{font-style:normal;color:var(--line);margin:0 5px}
.k-div{display:flex;align-items:center;gap:8px;margin:13px 0 9px;color:var(--gold);font-size:10px}
.k-div::before,.k-div::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.k-row{display:flex;align-items:flex-start;margin:7px 0;font-size:15px;line-height:1.65}
.k-lab{
  flex:0 0 auto;background:var(--teal);color:#f2f1e8;font-size:11.5px;letter-spacing:2px;text-indent:2px;
  padding:2.5px 8px;border-radius:4px;margin:2px 10px 0 0;
}
.k-lab.lab-cheng{background:var(--red)}
.k-lab.lab-gold{background:var(--gold)}
.k-val{color:var(--ink)}
.k-quote{
  border-left:3px solid var(--red);border-radius:0 8px 8px 0;padding:9px 13px;margin:8px 0;
  background:linear-gradient(90deg,rgba(176,58,46,.06),transparent 80%);
  font-size:16.5px;line-height:1.8;color:var(--ink);
}
.k-note{color:var(--muted);font-size:13px;line-height:1.7;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}

/* ================= 结果页 ================= */
.res-head{text-align:center;padding:26px 0 4px;font-size:17px;letter-spacing:6px;color:var(--ink2)}
.res-head::after{content:'';display:block;width:34px;height:2px;background:var(--red);margin:10px auto 0;border-radius:2px}
.res-card{margin:18px 16px 0;padding:30px 16px 22px;text-align:center;position:relative;overflow:hidden}
.res-score{font-size:66px;line-height:1;color:var(--red);font-weight:700;text-shadow:0 2px 0 rgba(176,58,46,.15)}
.res-total{font-size:19px;color:var(--muted);font-weight:400;margin-left:5px}
.res-word{font-size:13px;color:var(--muted);letter-spacing:3px;margin-top:10px}
.res-sub{display:flex;justify-content:center;gap:26px;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.res-sub div b{display:block;font-size:17px;color:var(--ink)}
.res-sub div span{font-size:11.5px;color:var(--muted);letter-spacing:1px}
.res-rank{
  position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--red);color:#fdf3e6;transform:rotate(6deg);
  box-shadow:0 4px 10px rgba(176,58,46,.35),inset 0 0 0 2px rgba(253,243,230,.4);
  animation:stampIn .6s .3s cubic-bezier(.18,1.2,.4,1) both;
}
.res-rank b{font-size:20px;line-height:1.1}
.res-rank span{font-size:8.5px;letter-spacing:1px;transform:scale(.9)}
.res-wrong{margin:18px 16px 0}
.res-wrong h3{font-size:14.5px;letter-spacing:3px;color:var(--ink2);margin-bottom:9px}
.res-wrong-item{padding:11px 13px;margin-bottom:8px;font-size:14.5px}
.res-wrong-item .rw-q{color:var(--ink);line-height:1.6}
.res-wrong-item .rw-a{font-size:12.5px;margin-top:4px}
.res-actions{padding:20px 16px 8px;display:flex;flex-direction:column;gap:11px}

/* ================= 总表页 ================= */
.page-head{padding:22px 16px 12px;display:flex;align-items:baseline;gap:10px}
.page-head h2{font-size:21px;letter-spacing:4px}
.page-head span{font-size:12px;color:var(--muted);letter-spacing:1px}
.page-head .head-act{margin-left:auto;min-height:44px;font-size:12.5px;color:var(--red);letter-spacing:1px;border:1px solid rgba(176,58,46,.4);border-radius:6px;padding:3px 12px}
.lib-search{display:flex;align-items:center;gap:8px;margin:0 16px 10px;padding:10px 13px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.lib-search svg{flex:0 0 auto;color:var(--muted)}
.lib-search input{flex:1;border:none;outline:none;background:none;font-size:16px;color:var(--ink);letter-spacing:1px;min-height:44px}
.lib-search input::placeholder{color:#b3aa94}
.lib-list{padding:4px 16px 0;display:flex;flex-direction:column;gap:10px}
.lib-item{position:relative;overflow:hidden;text-align:left;padding:13px 14px;animation:fadeUp .38s ease both}
.li-top{display:flex;align-items:baseline;gap:8px}
.li-top b{font-size:17.5px;letter-spacing:1px}
.li-tags{margin-left:auto;flex:0 0 auto;font-size:11px;color:var(--gold);letter-spacing:1px;border:1px solid rgba(184,134,11,.35);border-radius:4px;padding:1px 6px}
.li-meta{font-size:12.5px;color:var(--teal);margin-top:4px;letter-spacing:.5px}
.li-quote{font-size:13.5px;color:var(--muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-more{margin:14px 16px 4px}

/* ================= 作者页 ================= */
.dyn-group{margin-top:6px}
.dyn-head{display:flex;align-items:center;gap:9px;padding:12px 16px 7px}
.dyn-head b{font-size:15px;color:var(--red);letter-spacing:3px;border:1px solid rgba(176,58,46,.45);border-radius:5px;padding:1px 10px;background:rgba(176,58,46,.05)}
.dyn-head span{font-size:11.5px;color:var(--muted)}
.dyn-head::after{content:'';flex:1;height:1px;background:var(--line);opacity:.6}
.author-list{padding:0 16px}
.author-row{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:12px 13px;margin-bottom:9px;animation:fadeUp .38s ease both;
}
.ava{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:42px;height:42px;
  border-radius:8px;background:rgba(61,90,102,.09);color:var(--teal);font-size:19px;font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(61,90,102,.22);
}
.a-info{flex:1;min-width:0}
.a-info b{font-size:16.5px;letter-spacing:1px}
.a-info em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-arrow{color:#c4bba3;font-size:18px}

/* ================= 底部面板 / 弹窗 ================= */
#panel-root,#modal-root{position:fixed;inset:0;z-index:70;display:none}
#modal-root{z-index:80}
#panel-root.open,#modal-root.open{display:block}
.panel-mask,.modal-mask{position:absolute;inset:0;background:rgba(42,38,34,.42);animation:fadeIn .25s both}
.panel{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;height:87vh;
  background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -10px 34px rgba(42,38,34,.3);
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(20px + env(safe-area-inset-bottom));
  animation:slideUp .32s cubic-bezier(.2,.9,.3,1) both;
}
.panel-close,.modal-close{
  position:absolute;right:13px;top:13px;z-index:3;width:44px;height:44px;border-radius:50%;
  background:#efe8d4;color:var(--ink2);font-size:17px;line-height:1;box-shadow:0 2px 6px rgba(42,38,34,.15);
}
.panel-hero{padding:28px 20px 14px;text-align:center;border-bottom:1px dashed var(--line);position:relative}
.panel-hero .panel-name{font-size:34px;letter-spacing:8px;text-indent:8px;font-weight:700}
.panel-hero .panel-dyn{font-size:12.5px;color:var(--teal);letter-spacing:3px;margin-top:6px}
.panel-hero .panel-tag{
  display:inline-block;margin-top:10px;font-size:11.5px;color:var(--gold);letter-spacing:1px;
  border:1px solid rgba(184,134,11,.4);border-radius:999px;padding:2px 12px;
}
.p-rows{padding:13px 22px 4px}
.panel .k-div{margin:12px 8px 8px}
.p-sec{padding:14px 22px 8px;font-size:13.5px;letter-spacing:3px;color:var(--ink2)}
.p-sec b{color:var(--red)}
.p-works{padding:0 16px;display:flex;flex-direction:column;gap:9px}
.panel-work{position:relative;overflow:hidden;text-align:left;padding:11px 14px;animation:fadeUp .35s ease both}
.panel-work b{font-size:15.5px;letter-spacing:.5px}
.panel-work span{display:block;font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes popC{from{transform:translate(-50%,-50%) scale(.55);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.modal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,436px);
  max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 20px 20px;
  animation:popC .3s cubic-bezier(.2,1.15,.4,1) both;
}
.modal .modal-close{position:sticky;float:right;top:0;margin:-8px -8px 0 0}
.set-row{display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:14.5px;border-bottom:1px dashed var(--line)}
.set-row .lab{flex:0 0 auto;color:var(--muted);font-size:12.5px;letter-spacing:2px}
.set-row .val{color:var(--ink)}
.set-row .val .sync-badge{color:var(--green)}
.modal .btn-main{margin-top:16px}

/* ================= 错题页 ================= */
.wrong-actions{display:flex;gap:10px;padding:2px 16px 10px}
.wrong-actions .btn-main{flex:1;padding:11px;font-size:15.5px;letter-spacing:3px;text-indent:3px}
.wrong-actions .btn-ghost{flex:0 0 auto;width:auto;padding:11px 16px;font-size:13.5px;letter-spacing:2px}
.wrong-list{padding:2px 16px 0;display:flex;flex-direction:column;gap:10px}
.wrong-item{position:relative;overflow:hidden;padding:12px 13px;animation:fadeUp .38s ease both}
.wi-stem{font-size:15px;line-height:1.65}
.wi-tag{display:inline-block;font-size:10.5px;color:var(--gold);border:1px solid rgba(184,134,11,.35);border-radius:4px;padding:0 6px;margin-bottom:6px;letter-spacing:1px}
.wi-ans{font-size:12.5px;margin-top:6px}
.wi-mine{color:var(--red);margin-right:12px}
.wi-right{color:var(--green)}
.wi-foot{display:flex;align-items:center;gap:10px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted)}
.wi-count{color:var(--red)}
.wi-del{margin-left:auto;min-height:44px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 14px}

/* ================= 我的 ================= */
.me-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.me-cell{padding:15px 8px;text-align:center}
.me-cell b{display:block;font-size:24px;color:var(--red);line-height:1.2}
.me-cell span{font-size:11.5px;color:var(--muted);letter-spacing:2px}
.me-cell.m-teal b{color:var(--teal)}
.me-cell.m-gold b{color:var(--gold)}
.me-cell.m-green b{color:var(--green)}
.me-modes{margin:16px 16px 0;padding:14px 15px}
.me-modes h3{font-size:14px;letter-spacing:3px;color:var(--ink2);margin-bottom:11px}
.mm-row{display:flex;align-items:center;gap:10px;margin:9px 0}
.mm-name{flex:0 0 74px;font-size:13px;color:var(--ink2);letter-spacing:1px}
.mm-bar{flex:1;height:6px;border-radius:3px;background:#eae2cd;overflow:hidden}
.mm-bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--red));transition:width .7s cubic-bezier(.3,.8,.3,1)}
.mm-num{flex:0 0 76px;text-align:right;font-size:11.5px;color:var(--muted)}
.mm-num b{color:var(--ink)}
.me-mastered{margin:16px 16px 0;padding:13px 15px}
.me-mastered h3{font-size:14px;letter-spacing:3px;color:var(--ink2);margin-bottom:9px}
.me-chips{display:flex;flex-wrap:wrap;gap:7px}
.me-chips span{font-size:12px;color:var(--teal);background:rgba(61,90,102,.08);border-radius:6px;padding:3px 9px;letter-spacing:.5px}
.me-account{margin:16px 16px 0;padding:13px 15px;display:flex;align-items:center;gap:12px}
.me-account .acc-ava{
  flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--red);color:#fdf6ea;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;
}
.me-account .acc-info{flex:1;min-width:0}
.me-account .acc-info b{display:block;font-size:16px;letter-spacing:1px}
.me-account .acc-info span{font-size:11.5px;color:var(--muted);letter-spacing:1px}
.me-account .acc-info .sync-badge{color:var(--green)}
.me-account .btn-ghost{flex:0 0 auto;width:auto;min-height:40px;padding:8px 14px;font-size:13px}
.me-note{text-align:center;font-size:11px;color:#b3aa94;letter-spacing:2px;margin:20px 0 8px}

/* ================= Tab 栏 ================= */
#tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:50;
  display:flex;background:rgba(250,246,236,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
body.no-tab #tabbar{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:#9a917c;position:relative}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;letter-spacing:2px;text-indent:2px}
.tab.active{color:var(--red)}
.tab.active .tab-ico{animation:bounce .45s ease}
.tab.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.tab-badge{
  position:absolute;top:3px;left:calc(50% + 7px);min-width:16px;height:16px;border-radius:9px;
  background:var(--red);color:#fdf3ee;font-size:10px;line-height:16px;padding:0 4px;display:none;
}
.tab-badge.show{display:block}

/* ================= Toast ================= */
#toast-root{position:fixed;left:0;right:0;bottom:110px;z-index:99;display:flex;justify-content:center;pointer-events:none}
.toast{
  max-width:78%;background:rgba(42,38,34,.88);color:#f5efe0;font-size:13.5px;letter-spacing:1px;
  padding:10px 18px;border-radius:9px;animation:fadeUp .28s ease both;
}

/* ================= Hover 态（仅指针设备） ================= */
@media (hover:hover){
  .opt:hover{border-color:#c9bfa4;box-shadow:0 3px 10px rgba(90,80,60,.13)}
  .chip:not(.on):hover{border-color:#b9ae92;color:var(--ink)}
  .mode-card:not(.on):hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(90,80,60,.14)}
  .btn-main:hover{filter:brightness(1.07)}
  .btn-ghost:hover{background:#f4eedd}
  .lib-item:hover,.author-row:hover,.panel-work:hover{background:#f6efdd}
  .tab:hover{color:var(--ink2)}
  .wi-del:hover{color:var(--red);border-color:var(--red)}
  .head-act:hover{background:rgba(176,58,46,.06)}
  #btn-settings:hover{background:#f4eedd;color:var(--ink)}
  .quiz-quit:hover{color:var(--red);border-color:var(--red)}
}

/* ================= Pad 竖屏 ≥768px ================= */
@media (min-width:768px){
  body{font-size:17px}
  #app{max-width:720px}
  #btn-settings{right:calc(50% - 344px)}
  /* 字号整体 +1px（主要阅读文本） */
  .q-stem{font-size:22.5px}
  .opt{font-size:18px}
  .k-row{font-size:16px}
  .k-quote{font-size:17.5px}
  .verdict{font-size:16.5px}
  .wi-stem{font-size:16px}
  .res-wrong-item{font-size:15.5px}
  .hero{padding:30px 28px 6px}
  .hero-title{font-size:40px}
  .hero-sub{font-size:14px}
  .hero-user{font-size:13px}
  .hero-count{font-size:12.5px}
  .hero-seal{right:96px;top:40px;width:44px;height:44px;font-size:26px}
  .hero-mtn{height:240px}
  #tabbar{max-width:720px}
  .sec{padding:0 28px}
  .sec-head h2{font-size:17.5px}
  .chip-row{padding-left:28px;padding-right:28px}
  .sec .chip-row{padding:0 0 6px}
  /* 模式卡：横滑 → grid 2 行 × 3 列 */
  .mode-scroll{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;overflow:visible;padding:4px 0 10px}
  .mode-card{width:auto;min-height:104px}
  .mode-card .mode-name{font-size:16.5px}
  .mode-card .mode-desc{font-size:12px}
  .start-sec{padding-bottom:36px}
  .page-head{padding:26px 28px 12px}
  .lib-search{margin:0 28px 12px}
  .lib-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 28px 0}
  .lib-more{margin:14px 28px 4px}
  .author-list{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;padding:0 28px}
  .dyn-head{padding:12px 28px 7px}
  .wrong-actions,.wrong-list{padding-left:28px;padding-right:28px}
  .wrong-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .me-grid{padding:0 28px}
  .me-modes,.me-mastered,.me-account{margin-left:28px;margin-right:28px}
  .res-card{margin:18px 28px 0}
  .res-wrong{margin:18px 28px 0}
  .res-actions{padding:20px 28px 8px}
  .quiz-top{padding:12px 28px 4px}
  .quiz-body{padding:20px 28px 130px}
}
/* 登录页移动端竖排转横排 */
@media (max-width:767px){
  .login-box{flex-direction:column;min-height:0;width:min(94vw,420px)}
  .login-art{flex:0 0 auto;padding:24px 0 30px}
  .login-title{writing-mode:horizontal-tb;font-size:30px;letter-spacing:14px;text-indent:14px}
  .login-art .art-moon{width:38px;height:38px;right:18px;top:14px}
  .art-seal{bottom:8px}
  .login-form{padding:26px 26px 22px}
}

/* ================= PC / Pad 横屏 ≥1024px ================= */
@media (min-width:1024px){
  #app{max-width:960px}
  #btn-settings{right:calc(50% - 464px)}
  .hero-title{font-size:46px}
  .hero-mtn{height:300px}
  #tabbar{max-width:960px}
  /* 答题页左右布局：左约 60% 题干+选项，右约 40% 侧板 */
  .quiz-cols{display:flex;gap:26px;align-items:flex-start;padding:0 28px}
  .quiz-body{flex:0 0 58%;max-width:58%;padding:20px 0 130px}
  .quiz-side{flex:1 1 auto;max-width:calc(42% - 26px);display:block;position:sticky;top:86px;padding:20px 0 40px}
  /* 宽屏知识卡在右栏展开，底部弹层停用 */
  #sheet-wrap{display:none!important}
  .stamp{left:29%;margin-left:-44px}
  #view-result{max-width:640px;margin:0 auto}
  .panel{max-width:560px}
}

@media (min-width:481px){ body{padding:0} }

/* ---------- 工具 ---------- */
function $(s,root){ return (root||document).querySelector(s); }

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* 干扰项生成器：保证 n 项互异且含正确项，随机排序；素材不足返回 null */
function genOptions(correct, pool, n){
  n = n || 4;
  var seen = {}; seen[correct] = true;
  var uniq = [];
  for(var i=0;i<pool.length;i++){
    var v = pool[i];
    if(v && !seen[v]){ seen[v] = true; uniq.push(v); }
  }
  if(uniq.length < n-1) return null;
  shuffle(uniq);
  var opts = uniq.slice(0, n-1).concat([correct]);
  return shuffle(opts);
}

/* ================================================================
 * 账号 / API 层（新增）
 * token 存 sessionStorage（关浏览器即失效），用户名记忆存 localStorage。
 * 所有请求带 Authorization: Bearer <token>；任何 401 → 清 session 回登录页。
 * ================================================================ */
var Auth = {
  user:null, role:null,
  token:function(){ try{ return sessionStorage.getItem('gwt_token'); }catch(e){ return null; } },
  recallUser:function(){ try{ return sessionStorage.getItem('gwt_user'); }catch(e){ return null; } },
  save:function(token,user,role){
    try{
      sessionStorage.setItem('gwt_token',token);
      sessionStorage.setItem('gwt_user',user||'');
      sessionStorage.setItem('gwt_role',role||'');
    }catch(e){}
    this.user = user||''; this.role = role||'';
  },
  clear:function(){
    try{
      sessionStorage.removeItem('gwt_token');
      sessionStorage.removeItem('gwt_user');
      sessionStorage.removeItem('gwt_role');
    }catch(e){}
    this.user = null; this.role = null;
  }
};

function apiReq(method, path, body){
  var opt = { method:method, headers:{ 'Content-Type':'application/json' } };
  var tk = Auth.token();
  if(tk) opt.headers['Authorization'] = 'Bearer '+tk;
  if(body!==undefined) opt.body = JSON.stringify(body);
  return fetch(path, opt).then(function(res){
    if(res.status===401){ var e=new Error('unauthorized'); e.auth=true; throw e; }
    if(res.status===409){
      return res.json().catch(function(){ return {}; }).then(function(j){
        var e2=new Error('stale'); e2.status=409; e2.data=j; throw e2;
      });
    }
    if(!res.ok){ var e3=new Error('http_'+res.status); e3.status=res.status; throw e3; }
    return res.json().catch(function(){ return {}; });
  });
}

/* ---------- 本地存储（隐私模式降级为内存；进度键写入即标记待同步） ---------- */
var PROGRESS_KEYS = ['stats','wrong','days','mastered','daily'];
var store = {
  mem:{},
  get:function(k,def){
    try{
      var v = localStorage.getItem('gwt_'+k);
      return v==null ? def : JSON.parse(v);
    }catch(e){ return (k in this.mem) ? this.mem[k] : def; }
  },
  set:function(k,v){
    try{ localStorage.setItem('gwt_'+k, JSON.stringify(v)); }
    catch(e){ this.mem[k] = v; }
    if(PROGRESS_KEYS.indexOf(k)>=0) markDirty();
  }
};

/* ================================================================
 * 云同步层（新增）
 * - 写：先落 localStorage（离线可用）→ 标记 dirty → 防抖 3s PUT api/progress
 * - 读：登录后 GET api/progress 与本地合并（数字取大 / 集合并集 / daily 取新），写回两端
 * - 409: 用 server_snapshot 字段级合并后 rev=服务端rev+1 重试一次
 * - 网络失败：静默，30s 周期重试 / online 事件触发 / 页面隐藏触发
 * ================================================================ */
var sync = { dirty:false, timer:null, retryTimer:null, pushing:false, status:'local' };

function setSyncStatus(s){ sync.status = s; renderSyncBadge(); }
function syncLabel(){
  return { local:'本地模式', pending:'待同步', syncing:'同步中…', ok:'已同步', error:'将自动重试', offline:'离线' }[sync.status] || '';
}
function renderSyncBadge(){
  var txt = syncLabel();
  $$('.sync-badge').forEach(function(el){ el.textContent = txt; });
}
function markDirty(){
  sync.dirty = true;
  setSyncStatus(Auth.token() ? 'pending' : 'local');
  if(sync.timer) clearTimeout(sync.timer);
  sync.timer = setTimeout(pushProgress, 3000);
}

/* 进度快照 = 原 localStorage 进度对象 + rev */
function snapshot(){
  return {
    stats: store.get('stats',{ total:0, correct:0, byMode:{} }),
    wrong: store.get('wrong',[]),
    days: store.get('days',[]),
    mastered: store.get('mastered',[]),
    daily: store.get('daily',{ date:'', count:0 }),
    rev: store.get('rev',0)
  };
}
function writeSnapshot(snap){
  store.set('stats', snap.stats && snap.stats.byMode ? snap.stats : { total:0, correct:0, byMode:{} });
  store.set('wrong', Array.isArray(snap.wrong) ? snap.wrong : []);
  store.set('days', Array.isArray(snap.days) ? snap.days : []);
  store.set('mastered', Array.isArray(snap.mastered) ? snap.mastered : []);
  store.set('daily', snap.daily && snap.daily.date!==undefined ? snap.daily : { date:'', count:0 });
  if(typeof snap.rev==='number') store.set('rev', Math.max(0, Math.floor(snap.rev))); /* rev 不触发 dirty */
}

/* 字段级合并：数字取大、数组集合并集、wrong 按 sig 去重取大、daily 取新、rev 取 max */
function mergeSnapshots(local, server){
  server = server || {};
  var out = {};
  var ls = local.stats||{}, ss = server.stats||{};
  var byMode = {}, lm = ls.byMode||{}, sm = ss.byMode||{};
  Object.keys(lm).concat(Object.keys(sm)).forEach(function(k){
    var a=lm[k]||{}, b=sm[k]||{};
    byMode[k] = { total:Math.max(a.total||0, b.total||0), correct:Math.max(a.correct||0, b.correct||0) };
  });
  out.stats = { total:Math.max(ls.total||0, ss.total||0), correct:Math.max(ls.correct||0, ss.correct||0), byMode:byMode };
  function unionArr(a,b){
    var seen={}, out=[];
    a.concat(b).forEach(function(x){
      var k = (typeof x==='string') ? x : JSON.stringify(x);
      if(!seen[k]){ seen[k]=1; out.push(x); }
    });
    return out;
  }
  out.days = unionArr(local.days||[], server.days||[]);
  out.mastered = unionArr(local.mastered||[], server.mastered||[]);
  var wmap = {};
  (local.wrong||[]).forEach(function(w){ if(w && w.sig) wmap[w.sig]=w; });
  (server.wrong||[]).forEach(function(w){
    if(!w || !w.sig) return;
    if(!wmap[w.sig]) wmap[w.sig] = w;
    else {
      wmap[w.sig].count = Math.max(wmap[w.sig].count||1, w.count||1);
      wmap[w.sig].time = Math.max(wmap[w.sig].time||0, w.time||0);
    }
  });
  out.wrong = Object.keys(wmap).map(function(k){ return wmap[k]; });
  var ld = local.daily||null, sd = server.daily||null;
  if(!ld || !ld.date) out.daily = sd || { date:'', count:0 };
  else if(!sd || !sd.date) out.daily = ld;
  else if(ld.date===sd.date) out.daily = { date:ld.date, count:Math.max(ld.count||0, sd.count||0) };
  else out.daily = (ld.date > sd.date) ? ld : sd;
  out.rev = Math.max(local.rev||0, server.rev||0);
  return out;
}

function pushProgress(isRetry){
  if(sync.timer){ clearTimeout(sync.timer); sync.timer = null; }
  if(!Auth.token()){ setSyncStatus('local'); return; }
  if(!sync.dirty || sync.pushing) return;
  if(typeof navigator!=='undefined' && navigator.onLine===false){ setSyncStatus('offline'); scheduleSyncRetry(); return; }
  sync.pushing = true; setSyncStatus('syncing');
  if(!isRetry) store.set('rev', (store.get('rev',0)||0) + 1); /* 常规推送 rev 自增；409 重试沿用合并后的 rev（rev 键不触发 dirty） */
  var snap = snapshot();
  apiReq('PUT','api/progress',snap).then(function(){
    sync.pushing = false; sync.dirty = false; setSyncStatus('ok');
  }).catch(function(err){
    sync.pushing = false;
    if(err && err.auth){ onAuthLost(); return; }
    if(err && err.status===409 && !isRetry){
      /* 冲突：用服务端快照与本地合并，rev=服务端rev+1，重试一次 */
      var serverSnap = (err.data && err.data.server_snapshot) || {};
      var merged = mergeSnapshots(snap, serverSnap);
      merged.rev = (serverSnap.rev||0) + 1;
      writeSnapshot(merged);
      updateWrongBadge();
      pushProgress(true);
      return;
    }
    setSyncStatus('error');
    scheduleSyncRetry(); /* 网络失败静默重试 */
  });
}
function scheduleSyncRetry(){
  if(sync.retryTimer) return;
  sync.retryTimer = setTimeout(function(){
    sync.retryTimer = null;
    if(sync.dirty) pushProgress();
    flushLog();
  }, 30000);
}

/* 登录/启动后拉取云端进度并合并（写回两端：本地立即写，云端走防抖 PUT） */
function pullProgress(){
  if(!Auth.token()) return Promise.resolve(false);
  return apiReq('GET','api/progress').then(function(server){
    var merged = mergeSnapshots(snapshot(), server||{});
    writeSnapshot(merged);
    updateWrongBadge();
    markDirty();
    return true;
  }).catch(function(err){
    if(err && err.auth){ onAuthLost(); return false; }
    return false; /* 网络失败：纯本地，静默 */
  });
}

/* ---------- 学习日志（内存队列 + 本地持久化，批量上报） ---------- */
var logq = { buf:[], timer:null, sending:false };
function logEvent(type, fields){
  var ev = { t: Date.now(), type: type };
  if(fields) Object.keys(fields).forEach(function(k){ if(fields[k]!==undefined && fields[k]!==null) ev[k]=fields[k]; });
  logq.buf.push(ev);
  persistLogq();
  if(logq.buf.length >= 20){ flushLog(); }
  else if(!logq.timer){ logq.timer = setTimeout(flushLog, 30000); }
}
function persistLogq(){
  try{ localStorage.setItem('gwt_logq', JSON.stringify(logq.buf.slice(-300))); }catch(e){}
}
function flushLog(){
  if(logq.timer){ clearTimeout(logq.timer); logq.timer = null; }
  if(!logq.buf.length || !Auth.token() || logq.sending) return;
  if(typeof navigator!=='undefined' && navigator.onLine===false) return; /* 离线只留本地队列不丢 */
  logq.sending = true;
  var batch = logq.buf.slice();
  apiReq('POST','api/log',{ events:batch }).then(function(){
    logq.sending = false;
    logq.buf = logq.buf.slice(batch.length); /* 期间新增的事件保留 */
    persistLogq();
  }).catch(function(err){
    logq.sending = false;
    if(err && err.auth){ onAuthLost(); return; }
    scheduleSyncRetry(); /* 静默下个周期重试 */
  });
}

function onAuthLost(){
  Auth.clear();
  sync.dirty = false;
  setSyncStatus('local');
  showLogin('登录已过期，请重新登录');
}

/* ---------- 全局状态 ---------- */
var state = {
  view:'home',
  mode:'mixed', stage:'all', type:'all',
  lib:{ kw:'', stage:'all', type:'all', dyn:'all', shown:30 },
  session:null
};

/* ---------- 出题素材 ---------- */
function scopePoems(){
  return POEMS.filter(function(p){
    return (state.stage==='all' || p.stage===state.stage) && typeMatch(p.type, state.type);
  });
}
function authorsIn(pool){
  var s = {}; var out = [];
  pool.forEach(function(p){ if(p.author && !s[p.author]){ s[p.author]=1; out.push(p.author); } });
  return out;
}
function pickPoemOf(name, pool){
  var arr = pool.filter(function(p){ return p.author===name; });
  return arr.length ? pick(arr) : null;
}
function cleanHalf(s){ return String(s||'').replace(/。+$/,'').replace(/[；;]+$/,'').trim(); }
function allNamesPool(pool){ return authorsIn(pool).concat(Object.keys(AUTHORS)); }

/* ---------- 题型生成器（每种返回题目对象或 null） ---------- */
function mkQ(qtype,label,stem,options,answer,p){
  return { qtype:qtype, label:label, stem:stem, options:options, answer:answer,
           poemId:p?p.id:'', author:p?p.author:'', title:p?p.title:'' };
}
var GEN = {
  /* 「李白」的字是？ 选项为字 */
  zi_f:function(pool){
    var names = authorsIn(pool).filter(function(n){ return AUTHORS[n] && AUTHORS[n].zi; });
    if(!names.length) return null;
    var name = pick(names), correct = AUTHORS[name].zi;
    var dp = Object.keys(AUTHORS).map(function(n){ return AUTHORS[n].zi; }).filter(Boolean);
    var op = genOptions(correct, dp); if(!op) return null;
    return mkQ('zi_f','字号','「'+name+'」的字是？', op, correct, pickPoemOf(name,pool));
  },
  /* 「李白」的号是？ 选项为号 */
  hao_f:function(pool){
    var names = authorsIn(pool).filter(function(n){ return AUTHORS[n] && AUTHORS[n].hao; });
    if(!names.length) return null;
    var name = pick(names), correct = AUTHORS[name].hao;
    var dp = Object.keys(AUTHORS).map(function(n){ return AUTHORS[n].hao; }).filter(Boolean);
    var op = genOptions(correct, dp); if(!op) return null;
    return mkQ('hao_f','字号','「'+name+'」的号是？', op, correct, pickPoemOf(name,pool));
  },
  /* 世称「诗圣」的是哪位？ 选项为作者名；并称/群称（高岑、唐宋八大家之一等）不出单人题 */
  cheng_f:function(pool){
    var BAD = /之一|四杰|七子|十才子|八大家|四灵|四学士|二安|三大家|六君子|八俊|四才子|八怪|高岑|苏辛|苏黄|老庄|《/;
    var cands = [];
    Object.keys(AUTHORS).forEach(function(n){
      var c = AUTHORS[n].cheng; if(!c) return;
      String(c).split('、').forEach(function(seg){
        seg = seg.trim();
        if(seg && !BAD.test(seg)) cands.push({ name:n, cheng:seg });
      });
    });
    var inPool = cands.filter(function(c){ return pool.some(function(p){ return p.author===c.name; }); });
    if(!inPool.length) return null;
    var c = pick(inPool);
    var op = genOptions(c.name, allNamesPool(pool)); if(!op) return null;
    return mkQ('cheng_f','字号','世称「'+c.cheng+'」的是哪位？', op, c.name, pickPoemOf(c.name,pool));
  },
  /* 「太白」是哪位诗人的字？ 选项为作者名 */
  zi_r:function(pool){
    var names = authorsIn(pool).filter(function(n){ return AUTHORS[n] && AUTHORS[n].zi; });
    if(!names.length) return null;
    var name = pick(names), zi = AUTHORS[name].zi;
    var op = genOptions(name, allNamesPool(pool)); if(!op) return null;
    return mkQ('zi_r','字号','「'+zi+'」是哪位诗人的字？', op, name, pickPoemOf(name,pool));
  },
  /* 「青莲居士」是哪位诗人的号？ 选项为作者名 */
  hao_r:function(pool){
    var names = authorsIn(pool).filter(function(n){ return AUTHORS[n] && AUTHORS[n].hao; });
    if(!names.length) return null;
    var name = pick(names), hao = AUTHORS[name].hao;
    var op = genOptions(name, allNamesPool(pool)); if(!op) return null;
    return mkQ('hao_r','字号','「'+hao+'」是哪位诗人的号？', op, name, pickPoemOf(name,pool));
  },
  /* 名句出自哪部作品？干扰优先同学段同类型 */
  quote_src:function(pool){
    var cands = pool.filter(function(p){ return p.quotes && p.quotes.length; });
    if(!cands.length) return null;
    var p = pick(cands), quote = pick(p.quotes), correct = p.title;
    var all = POEMS.filter(function(x){ return x.title && x.title!==correct; });
    var s1 = all.filter(function(x){ return x.stage===p.stage && TYPE_GROUP[x.type]===TYPE_GROUP[p.type]; });
    var s2 = all.filter(function(x){ return x.stage===p.stage; });
    var src = s1.length>=3 ? s1 : (s2.length>=3 ? s2 : all);
    var op = genOptions(correct, src.map(function(x){ return x.title; })); if(!op) return null;
    return mkQ('quote_src','名句·出处','「'+quote+'」出自哪部作品？', op, correct, p);
  },
  /* 名句作者是谁？ */
  quote_author:function(pool){
    var cands = pool.filter(function(p){ return p.quotes && p.quotes.length && p.author; });
    if(!cands.length) return null;
    var p = pick(cands), quote = pick(p.quotes);
    var op = genOptions(p.author, allNamesPool(pool)); if(!op) return null;
    return mkQ('quote_author','名句·作者','「'+quote+'」的作者是谁？', op, p.author, p);
  },
  /* 名句填空：quotes[0] 拆上下句随机挖一句 */
  blank:function(pool){
    var cands = pool.filter(function(p){
      if(!p.quotes || !p.quotes[0]) return false;
      var parts = p.quotes[0].split('，');
      return parts.length===2 && cleanHalf(parts[0]) && cleanHalf(parts[1]);
    });
    if(!cands.length) return null;
    var p = pick(cands);
    var parts = p.quotes[0].split('，');
    var upper = cleanHalf(parts[0]), lower = cleanHalf(parts[1]);
    var pos = Math.random()<0.5 ? 0 : 1;
    var kept = pos===0 ? lower : upper, ans = pos===0 ? upper : lower;
    var halves = [];
    POEMS.forEach(function(x){
      if(!x.quotes || !x.quotes[0]) return;
      x.quotes.slice(0,2).forEach(function(q){
        q.split('，').forEach(function(seg){
          var h = cleanHalf(seg);
          if(h && h!==ans && h!==kept && h.length>=2) halves.push(h);
        });
      });
    });
    var op = genOptions(ans, halves); if(!op) return null;
    var stem = pos===0 ? '＿＿＿＿，'+lower+'。' : upper+'，＿＿＿＿。';
    return mkQ('blank','填空', stem, op, ans, p);
  },
  /* 体裁 */
  genre:function(pool){
    var cands = pool.filter(function(p){ return p.genre; });
    if(!cands.length) return null;
    var p = pick(cands);
    var gp = POEMS.map(function(x){ return x.genre; }).filter(Boolean);
    var op = genOptions(p.genre, gp); if(!op) return null;
    return mkQ('genre','体裁','《'+p.title+'》的体裁是？', op, p.genre, p);
  },
  /* 朝代 */
  dynasty:function(pool){
    var cands = pool.filter(function(p){ return p.dynasty && p.author; });
    if(!cands.length) return null;
    var p = pick(cands);
    var dp = DYN_BASE.slice();
    POEMS.forEach(function(x){ if(x.dynasty && dp.indexOf(x.dynasty)<0) dp.push(x.dynasty); });
    dp = dp.filter(function(d){ return d!==p.dynasty; });
    var op = [p.dynasty].concat(shuffle(dp).slice(0,3));
    shuffle(op);
    return mkQ('dynasty','朝代','《'+p.title+'》的作者'+p.author+'是哪个朝代的人？', op, p.dynasty, p);
  }
};

/* ---------- 组卷 ---------- */
function startSession(mode){
  var pool = scopePoems();
  if(pool.length < 2){ toast('该范围内作品不足，换个筛选试试'); return; }
  var types = MODE_TYPES[mode] || MODE_TYPES.mixed;
  var qs = [], seen = {};
  var guard = types.length*24 + 80;
  while(qs.length < SESSION_LEN && guard-- > 0){
    var g = GEN[pick(types)];
    if(!g) continue;
    var q = g(pool);
    if(!q) continue;
    var sig = q.qtype+'|'+q.stem;
    if(seen[sig]) continue;
    seen[sig] = 1;
    qs.push(q);
  }
  if(!qs.length){ toast('题量不足，换个范围或模式'); return; }
  state.session = { mode:mode, questions:qs, idx:0, correct:0, combo:0,
                    start:Date.now(), answered:false, picked:null };
  showView('quiz');
  renderQuestion();
}
function startWrongPractice(){
  var list = store.get('wrong',[]);
  if(!list.length){ toast('错题本已清空'); return; }
  var qs = list.slice(0,SESSION_LEN).map(function(w){
    return { qtype:w.qtype, label:w.label||'错题', stem:w.stem,
             options:shuffle((w.options||[]).slice()), answer:w.answer,
             poemId:w.poemId||'', author:'', title:'' };
  });
  state.session = { mode:'wrong', questions:qs, idx:0, correct:0, combo:0,
                    start:Date.now(), answered:false, picked:null };
  showView('quiz');
  renderQuestion();
}

/* ---------- 答题流程 ---------- */
function renderQuestion(){
  var s = state.session; if(!s) return;
  var q = s.questions[s.idx];
  s.qStart = Date.now();
  $('#quiz-mode').textContent = s.mode==='wrong' ? '错题重练' : (MODES[s.mode] ? MODES[s.mode].name : '');
  $('#quiz-num').textContent = (s.idx+1)+' / '+s.questions.length;
  $('#pbar-fill').style.width = (s.idx / s.questions.length * 100)+'%';
  $('#quiz-combo').textContent = s.combo>=2 ? '连对 '+s.combo : '';
  $('#combo-badge').classList.remove('show');
  $('#q-tag').textContent = q.label;
  var stem = $('#q-stem');
  stem.textContent = q.stem;
  stem.classList.remove('q-anim'); void stem.offsetWidth; stem.classList.add('q-anim');
  $('#opt-list').innerHTML = q.options.map(function(o,i){
    return '<button class="opt" data-act="opt" data-idx="'+i+'">'
      + '<span class="opt-key">'+KEYS[i]+'</span><span class="opt-txt">'+esc(o)+'</span></button>';
  }).join('');
  hideSheet();
}
function answer(idx){
  var s = state.session;
  if(!s || s.answered) return;
  var q = s.questions[s.idx];
  var ok = q.options[idx] === q.answer;
  s.answered = true; s.picked = q.options[idx]; q._ok = ok; q._picked = q.options[idx];
  var opts = $$('#opt-list .opt');
  opts.forEach(function(b,i){
    b.classList.add('done');
    if(q.options[i]===q.answer) b.classList.add('correct');
  });
  if(ok){
    s.correct++; s.combo++;
    opts[idx].classList.add('picked');
    showStamp(s.combo>=3);
    if(s.combo>=3) $('#combo-badge').classList.add('show');
  }else{
    s.combo = 0;
    opts[idx].classList.add('wrong','shake');
    setTimeout(function(){ opts.forEach(function(b){ if(b.classList.contains('correct')) b.classList.add('breathe'); }); }, 480);
  }
  $('#quiz-combo').textContent = s.combo>=2 ? '连对 '+s.combo : '';
  recordAnswer(q, ok, s.mode);
  setTimeout(function(){ openSheet(q, ok); }, ok ? 780 : 640);
}
function showStamp(isCombo){
  var v = $('#view-quiz');
  var old = $('#stamp'); if(old) old.remove();
  var el = document.createElement('div');
  el.id = 'stamp';
  el.className = 'stamp' + (isCombo ? ' combo' : '');
  el.innerHTML = '<span>'+(isCombo ? '连中三元' : '对')+'</span>';
  v.appendChild(el);
  setTimeout(function(){
    if(!el.parentNode) return;
    el.classList.add('stamp-out');
    setTimeout(function(){ el.remove(); }, 340);
  }, 1350);
}
function next(){
  var s = state.session; if(!s) return;
  if(s.idx+1 >= s.questions.length){ finishSession(); return; }
  s.idx++; s.answered = false; s.picked = null;
  renderQuestion();
}
function finishSession(){
  var s = state.session;
  if(s){
    logEvent('session_end', { mode:s.mode, total:s.questions.length, correct:s.correct,
      acc:(s.questions.length? Math.round(s.correct/s.questions.length*100):0),
      dur: Math.max(1, Math.round((Date.now()-s.start)/1000)) });
    flushLog();
  }
  hideSheet();
  renderResult();
  showView('result');
}
function quitQuiz(){
  state.session = null;
  hideSheet();
  showView('home');
}

/* ---------- 错题本 / 统计 ---------- */
function sigOf(q){ return q.qtype+'|'+(q.poemId||'')+'|'+q.answer; }
function addWrong(q, picked){
  var list = store.get('wrong',[]);
  var sig = sigOf(q);
  var it = null;
  for(var i=0;i<list.length;i++){ if(list[i].sig===sig){ it = list[i]; break; } }
  if(it){ it.count++; it.picked = picked; it.time = Date.now(); }
  else list.push({ sig:sig, qtype:q.qtype, label:q.label, stem:q.stem, options:q.options,
                   answer:q.answer, poemId:q.poemId||'', picked:picked, count:1, time:Date.now() });
  store.set('wrong', list);
  updateWrongBadge();
}
function reduceWrong(q){
  var list = store.get('wrong',[]);
  var sig = sigOf(q), hit = false;
  list = list.filter(function(w){
    if(w.sig===sig){ w.count--; hit = true; return w.count > 0; }
    return true;
  });
  if(hit){ store.set('wrong', list); updateWrongBadge(); }
}
function recordAnswer(q, ok, mode){
  var s = state.session;
  var dur = (s && s.qStart) ? Math.max(1, Math.round((Date.now()-s.qStart)/1000)) : 0;
  /* 学习日志埋点：答题 */
  logEvent('answer', { qtype:q.qtype, label:q.label, ok:ok, mode:mode,
    poem:q.poemId||'', title:q.title||'', picked:q._picked||'', answer:q.answer,
    combo:(s?s.combo:0), dur:dur });
  var st = store.get('stats',{ total:0, correct:0, byMode:{} });
  st.total++;
  if(!st.byMode[mode]) st.byMode[mode] = { total:0, correct:0 };
  st.byMode[mode].total++;
  if(ok){
    st.correct++; st.byMode[mode].correct++;
    if(q.poemId){
      var m = store.get('mastered',[]);
      if(m.indexOf(q.poemId)<0){ m.push(q.poemId); store.set('mastered',m); }
    }
  }
  store.set('stats', st);
  var d = todayStr();
  var days = store.get('days',[]);
  if(days.indexOf(d)<0){ days.push(d); store.set('days',days); }
  var dl = store.get('daily',{ date:d, count:0 });
  if(dl.date !== d){ dl.date = d; dl.count = 0; }
  dl.count++; store.set('daily', dl);
  if(ok) reduceWrong(q); else addWrong(q, q._picked||'');
  /* 宽屏侧板实时刷新（若尚未切到知识卡） */
  if(wide() && state.view==='quiz' && !$('#sheet-wrap').classList.contains('open') && !$('#quiz-side .side-verdict')) renderSideDefault();
}
function updateWrongBadge(){
  var n = store.get('wrong',[]).length;
  var b = $('#wrong-badge');
  if(!b) return;
  b.textContent = n > 99 ? '99+' : n;
  b.classList.toggle('show', n>0);
}
function streakDays(){
  var set = {}; store.get('days',[]).forEach(function(d){ set[d]=1; });
  var d = new Date();
  if(!set[todayStr()]) d.setDate(d.getDate()-1);
  var n = 0;
  while(set[d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---------- 视图切换 ---------- */
function showView(name){
  state.view = name;
  $$('.view').forEach(function(v){ v.classList.toggle('active', v.id==='view-'+name); });
  document.body.classList.toggle('no-tab', name==='quiz' || name==='result');
  $$('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.tab===name); });
  if(name==='home') renderHome();
  if(name==='library') renderLibrary();
  if(name==='author') renderAuthors();
  if(name==='wrong') renderWrong();
  if(name==='me') renderMe();
  window.scrollTo(0,0);
}

/* ---------- 知识卡 ---------- */
function knowledgeHTML(p){
  var a = AUTHORS[p.author] || {};
  var rows = '';
  if(a.zi)   rows += '<div class="k-row"><span class="k-lab">字</span><span class="k-val">'+esc(a.zi)+'</span></div>';
  if(a.hao)  rows += '<div class="k-row"><span class="k-lab">号</span><span class="k-val">'+esc(a.hao)+'</span></div>';
  if(a.cheng)rows += '<div class="k-row"><span class="k-lab lab-cheng">世称</span><span class="k-val">'+esc(a.cheng)+'</span></div>';
  var gtxt = p.genre ? (p.type && p.genre.indexOf(p.type)===0 ? p.genre : (p.type ? p.type+' · '+p.genre : p.genre)) : (p.type||'');
  if(gtxt) rows += '<div class="k-row"><span class="k-lab lab-gold">体裁</span><span class="k-val">'+esc(gtxt)+'</span></div>';
  if(p.from) rows += '<div class="k-row"><span class="k-lab">出处</span><span class="k-val">'+esc(p.from)+'</span></div>';
  var meta = esc(p.author||'') + ' <i>·</i> ' + esc(p.dynasty||'')
    + (p.stage ? ' <i>·</i> '+esc(p.stage)+(p.grade?' '+esc(p.grade):'') : '');
  var quotes = (p.quotes||[]).map(function(q){ return '<div class="k-quote">'+esc(q)+'</div>'; }).join('');
  return '<div class="k-head"><div class="k-title">'+esc(p.title||'（未知作品）')+'</div>'
    + '<div class="k-meta">'+meta+'</div></div>'
    + '<div class="k-div">✦</div>'
    + (rows ? '<div class="k-rows">'+rows+'</div>' : '')
    + (quotes ? '<div class="k-quotes">'+quotes+'</div>' : '')

/* ---------- 结果页 ---------- */
function renderResult(){
  var s = state.session; if(!s) return;
  var total = s.questions.length, c = s.correct;
  var dur = Math.max(1, Math.round((Date.now()-s.start)/1000));
  var acc = total ? Math.round(c/total*100) : 0;
  var wrongs = s.questions.filter(function(q){ return q._ok === false; });
  var rank, word;
  if(c===total){ rank='冠'; word='十全十美 · 状元及第'; }
  else if(acc>=80){ rank='优'; word='卓有成效 · 进士出身'; }
  else if(acc>=60){ rank='可'; word='渐入佳境 · 金榜可期'; }
  else { rank='勉'; word='温故知新 · 再接再厉'; }
  var wrongHTML = wrongs.length
    ? '<div class="res-wrong"><h3>本组错题 · '+wrongs.length+' 题</h3>'
      + wrongs.map(function(q){
          return '<div class="res-wrong-item card"><div class="rw-q">'+esc(q.stem)+'</div>'
            + '<div class="rw-a"><span class="v-mine">你的答案：'+esc(q._picked)+'</span><span class="v-right">正确：'+esc(q.answer)+'</span></div></div>';
        }).join('') + '</div>'
    : '<div class="res-wrong"><h3>本组错题</h3><div class="empty card" style="padding:22px">全对，无错题 ✓</div></div>';
  $('#view-result').innerHTML =
    '<header class="res-head">练习完成</header>'
    + '<div class="res-card card">'
    +   '<div class="res-rank"><b>'+rank+'</b><span>'+word.slice(0,2)+'</span></div>'
    +   '<div><span class="res-score" id="result-score">0</span><span class="res-total">/ '+total+'</span></div>'
    +   '<div class="res-word">'+word+'</div>'
    +   '<div class="res-sub">'
    +     '<div><b>'+acc+'%</b><span>正确率</span></div>'
    +     '<div><b>'+fmtDur(dur)+'</b><span>用时</span></div>'
    +     '<div><b>'+s.combo+'</b><span>结尾连对</span></div>'
    +   '</div>'
    + '</div>'
    + wrongHTML
    + '<div class="res-actions">'
    +   (wrongs.length ? '<button class="btn-main" id="btn-wrong-retry" data-act="wrong-practice">错题重练</button>' : '')
    +   '<button class="btn-ghost" data-act="again">再来一组</button>'
    +   '<button class="btn-ghost" data-act="go-home">返回首页</button>'
    + '</div>';
  rollNumber($('#result-score'), c);
}
function rollNumber(el, to){
  if(!el) return;
  var dur = 900, st = Date.now();
  var timer = setInterval(function(){
    var p = Math.min(1, (Date.now()-st)/dur);
    el.textContent = Math.round(to * (1 - Math.pow(1-p,3)));
    if(p>=1) clearInterval(timer);
  }, 40);
}

function libFiltered(){
  var f = state.lib, kw = f.kw.trim().toLowerCase();
  return POEMS.filter(function(p){
    if(f.stage!=='all' && p.stage!==f.stage) return false;
    if(f.type!=='all' && !typeMatch(p.type, f.type)) return false;
    if(f.dyn!=='all' && p.dynasty!==f.dyn) return false;
    if(kw){
      var a = AUTHORS[p.author] || {};
      var hay = (p.title+' '+p.author+' '+p.dynasty+' '+(p.genre||'')+' '+(p.type||'')+' '
        + (p.quotes||[]).join(' ')+' '+(a.zi||'')+' '+(a.hao||'')+' '+(a.cheng||'')+' '+(p.from||'')).toLowerCase();

    return true;

  $('#login-view').classList.remove('show');
  document.body.classList.remove('prelogin');
}
function doLogin(){
  /* 清洗不可见字符/空白：自动填充与粘贴最常见的坑 */
  var strip = function(x){ return String(x||'').replace(/[\u200b\u200c\u200d\ufeff\u00a0\u3000]/g,'').trim(); };
  var u = strip($('#login-user').value), p = strip($('#login-pass').value);
  if(!u || !p){ $('#login-msg').textContent = '请输入用户名和密码'; return; }
  $('#login-msg').textContent = '';
  var btn = $('#btn-login');
  btn.disabled = true; btn.textContent = '登录中…';
  var ctl = ('AbortController' in window) ? new AbortController() : null;
  var timer = ctl ? setTimeout(function(){ ctl.abort(); }, 8000) : null;
  fetch('api/login', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ user:u, password:p }),
    signal: ctl ? ctl.signal : undefined
  }).then(function(res){
    if(res.status===401){ var e=new Error('badcred'); e.wrong=true; throw e; }
    if(!res.ok){ var e2=new Error('http_'+res.status); e2.http=true; throw e2; }
    return res.json();
  }).then(function(j){
    /* 登录成功：存 session，记住用户名（不记密码） */
    Auth.save(j.token, j.user||u, j.role||'');
    store.set('user_recall', u);
    logEvent('login', { user:Auth.user, role:Auth.role });
    hideLogin();
    enterApp();
    toast('欢迎，'+Auth.user);
    pullProgress().then(function(){ flushLog(); });
  }).catch(function(err){
    if(err && err.wrong){
      $('#login-msg').textContent = '用户名或密码错误';
      toast('用户名或密码错误');
    }else if(err && err.http){
      $('#login-msg').textContent = '服务暂不可用，请稍后再试';
    }else if(err && err.name==='AbortError'){
      $('#login-msg').textContent = '连接超时，请重试';
    }else{
      /* 网络不通：静默降级为纯本地模式（离线可用） */
      Auth.clear();
      store.set('user_recall', u);
      hideLogin();
      enterApp();
      setSyncStatus('local');
      toast('当前无法连接服务，已进入本地模式');
    }
  }).catch(function(){ /* 二次兜底 */ }).then(function(){
    if(timer) clearTimeout(timer);
    btn.disabled = false; btn.textContent = '登录';
  });
}

/* ================================================================
 * 启动流程（新增）
 * 有 token → api/me 校验 → 进应用并拉取云端进度；
 * 无 token / 401 → 登录页；网络不通 → 本地模式直接进应用。
 * ================================================================ */
var appBooted = false;
function enterApp(){
  hideLogin();
  if(!appBooted){
    appBooted = true;
    updateWrongBadge();
    renderHome();
    showView('home');
  }else{
    renderHome();
  }
  setSyncStatus(Auth.token() ? 'pending' : 'local');
  renderSyncBadge();
}
function boot(){
  logq.buf = store.get('logq',[]);
  var saved = Auth.recallUser();
  if(saved) Auth.user = saved;
  var tk = Auth.token();
  if(!tk){ showLogin(); return; }
  apiReq('GET','api/me').then(function(me){
    Auth.user = me.user || Auth.user || '';
    Auth.role = me.role || '';
    enterApp();
    pullProgress();
  }).catch(function(err){
    if(err && err.auth){ Auth.clear(); showLogin(); return; }
    /* 网络不通：本地模式进入，稍后在线时自动补同步 */
    enterApp();
    setSyncStatus('offline');
    scheduleSyncRetry();
  });
}

/* ---------- 事件绑定 ---------- */
var ACT = {
  'tab':function(el){ showView(el.dataset.tab); },
  'mode':function(el){
    state.mode = el.dataset.mode;
    $$('.mode-card').forEach(function(c){ c.classList.toggle('on', c.dataset.mode===state.mode); });
  },
  'scope':function(el){
    var k = el.dataset.kind, v = el.dataset.val;
    if(k==='stage') state.stage = v;
    if(k==='type') state.type = v;
    if(k==='libstage') state.lib.stage = v;
    if(k==='libtype') state.lib.type = v;
    if(k==='libdyn') state.lib.dyn = v;
    if(k==='libstage'||k==='libtype'||k==='libdyn'){ state.lib.shown = 30; renderLibrary(); }
    else renderHome();
  },
  'start':function(){ startSession(state.mode); },
  'opt':function(el){ answer(parseInt(el.dataset.idx,10)); },
  'next':function(){ next(); },
  'quit':function(){ quitQuiz(); },
  'sheet-toggle':function(){ toggleSheet(); },
  'sheet-close':function(){ toggleSheet(false); },
  'poem':function(el){ openModal(el.dataset.poem); },
  'author':function(el){ openPanel(el.dataset.author); },
  'close-panel':function(){ closePanel(); },
  'close-modal':function(){ closeModal(); },
  'settings':function(){ openSettings(); },
  'logout':function(){ doLogout(); },
  'login-nav':function(){ closeModal(); showLogin(); },
  'lib-more':function(){ state.lib.shown += 30; renderLibList(); },
  'wrong-del':function(el){
    var sig = el.dataset.sig;
    store.set('wrong', store.get('wrong',[]).filter(function(w){ return w.sig!==sig; }));
    updateWrongBadge(); renderWrong();
  },
  'wrong-clear':function(){
    store.set('wrong',[]); updateWrongBadge(); renderWrong(); toast('错题本已清空');
  },
  'wrong-practice':function(){ startWrongPractice(); },
  'again':function(){ startSession(state.session && state.session.mode!=='wrong' ? state.session.mode : state.mode); },
  'go-home':function(){ state.session = null; showView('home'); }
};
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var fn = ACT[el.dataset.act];
  if(fn){ e.preventDefault(); fn(el); }
});
/* 按压涟漪 */
document.addEventListener('pointerdown', function(e){
  var t = e.target.closest('.opt,.btn-main,.mode-card,.chip,.btn-ghost,.author-row,.lib-item,.panel-work');
  if(!t) return;
  var r = t.getBoundingClientRect();
  var size = Math.max(r.width, r.height) * 1.1;
  var s = document.createElement('span');
  s.className = 'ripple';
  s.style.width = s.style.height = size+'px';
  s.style.left = (e.clientX - r.left - size/2)+'px';
  s.style.top = (e.clientY - r.top - size/2)+'px';
  t.appendChild(s);
  setTimeout(function(){ s.remove(); }, 620);
});
/* 解析卡上滑展开 / 下滑收起（移动端） */
var touchY = null;
document.addEventListener('touchstart', function(e){
  if(e.target.closest && e.target.closest('.sheet')) touchY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchmove', function(e){
  if(touchY==null) return;
  var dy = e.touches[0].clientY - touchY;
  if(dy < -36){ toggleSheet(true); touchY = null; }
  else if(dy > 36){ toggleSheet(false); touchY = null; }
}, {passive:true});
/* 登录表单回车提交 */
document.addEventListener('submit', function(e){
  if(e.target && e.target.id==='login-form'){ e.preventDefault(); doLogin(); }
});

/* ---------- 全局网络 / 生命周期监听 ---------- */
document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    if(sync.dirty) pushProgress();
    flushLog();
  }
});
window.addEventListener('pagehide', function(){
  if(sync.dirty) pushProgress();
  flushLog();
});
window.addEventListener('online', function(){
  if(Auth.token()){
    setSyncStatus('pending');
    if(sync.dirty) pushProgress();
    flushLog();
  }
});
window.addEventListener('offline', function(){
  setSyncStatus('offline');
});
window.addEventListener('resize', function(){
  /* 跨 1024 断点时刷新侧板（纯本地渲染，不发请求） */
  if(state.view==='quiz' && state.session && !state.session.answered) renderSideDefault();
});

/* ---------- 启动 ---------- */
boot();
/* 供调试/自动化测试使用 */
window.GWTAPP = { state:state, store:store, POEMS:POEMS, AUTHORS:AUTHORS, Auth:Auth, sync:sync, logq:logq,
                  pushProgress:pushProgress, flushLog:flushLog, snapshot:snapshot };
</script>
